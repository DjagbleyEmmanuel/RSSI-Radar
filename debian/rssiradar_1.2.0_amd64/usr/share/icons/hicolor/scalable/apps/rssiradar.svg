<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#40e0ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#40e0ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#40e0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#40e0ff"/>
      <stop offset="100%" stop-color="#1e6e82"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="28" fill="#060a0e"/>

  <g transform="translate(128,128)">
    <!-- range rings -->
    <circle r="96" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85"/>
    <circle r="64" fill="none" stroke="#2a4e5c" stroke-width="1.6"/>
    <circle r="32" fill="none" stroke="#2a4e5c" stroke-width="1.6"/>

    <!-- sweep -->
    <path d="M0,0 L0,-96 A96,96 0 0,1 55.4,-48 Z" fill="url(#sweep)"/>
    <line x1="0" y1="0" x2="0" y2="-96" stroke="#40e0ff" stroke-width="2.5"
          filter="url(#glow)"/>

    <!-- spokes -->
    <g stroke="#1c303a" stroke-width="1.4">
      <line x1="0" y1="-96" x2="0" y2="96"/>
      <line x1="-96" y1="0" x2="96" y2="0"/>
      <line x1="-68" y1="-68" x2="68" y2="68"/>
      <line x1="68" y1="-68" x2="-68" y2="68"/>
    </g>

    <!-- target blips -->
    <circle cx="0" cy="-52" r="6" fill="#60ffa8" filter="url(#glow)"/>
    <circle cx="-44" cy="34" r="4.5" fill="#ffba42"/>
    <circle cx="48" cy="40" r="4" fill="#ff5caa"/>
  </g>

  <!-- baseline -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#40e0ff" stroke-width="2"
          opacity="0.35"/>
</svg>